name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[deploy]') || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Trigger Render deployment
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
            echo "✅ Backend deployment triggered on Render"
          else
            echo "⚠️ RENDER_DEPLOY_HOOK_URL not configured"
          fi
  
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[deploy]') || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to Vercel
        run: |
          if [ -n "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}" ]; then
            curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
            echo "✅ Frontend deployment triggered on Vercel"
          else
            echo "⚠️ VERCEL_DEPLOY_HOOK_URL not configured"
          fi
  
  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: always()
    
    steps:
      - name: Send deployment notification
        uses: actions/github-script@v7
        with:
          script: |
            const commit = context.payload.head_commit;
            const status = '${{ needs.deploy-backend.result }}' === 'success' && 
                          '${{ needs.deploy-frontend.result }}' === 'success' 
                          ? '✅ Success' : '❌ Failed';
            
            // Create deployment comment on latest commit
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `## Deployment Status: ${status}\n\n` +
                    `**Backend**: ${{ needs.deploy-backend.result }}\n` +
                    `**Frontend**: ${{ needs.deploy-frontend.result }}\n\n` +
                    `Triggered by: ${context.actor}`
            });
