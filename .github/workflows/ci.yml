name: CI - Tests and Lint

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  backend-tests:
    name: Backend Tests (Python)
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio
      
      - name: Create test .env file
        working-directory: ./backend
        run: |
          cat > .env << EOF
          DEBUG=True
          DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
          REDIS_URL=redis://localhost:6379/0
          CLERK_SECRET_KEY=test_key
          OPENAI_API_KEY=test_key
          RESEND_API_KEY=test_key
          PLAID_CLIENT_ID=test_id
          PLAID_SECRET=test_secret
          PLAID_ENV=sandbox
          CORS_ORIGINS=http://localhost:3000
          APP_BASE_URL=http://localhost:8000
          EOF
      
      - name: Run database migrations
        working-directory: ./backend
        run: |
          alembic upgrade head
      
      - name: Run backend tests
        working-directory: ./backend
        run: |
          pytest tests/ -v --cov=. --cov-report=xml --cov-report=term
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

  backend-lint:
    name: Backend Linting
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black isort mypy
      
      - name: Run Ruff
        working-directory: ./backend
        run: ruff check . --output-format=github
        continue-on-error: true
      
      - name: Check Black formatting
        working-directory: ./backend
        run: black --check .
        continue-on-error: true
      
      - name: Check import sorting
        working-directory: ./backend
        run: isort --check-only .
        continue-on-error: true

  frontend-tests:
    name: Frontend Tests (Next.js)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Create test .env.local file
        working-directory: ./frontend
        run: |
          cat > .env.local << EOF
          NEXT_PUBLIC_API_URL=http://localhost:8000
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=test_key
          EOF
      
      - name: Run linting
        working-directory: ./frontend
        run: npm run lint
        continue-on-error: true
      
      - name: Run type checking
        working-directory: ./frontend
        run: npx tsc --noEmit
        continue-on-error: true
      
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: test_key

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  pr-checks:
    name: PR Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check PR title follows conventional commits
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
      
      - name: Check for merge conflicts
        run: |
          git fetch origin ${{ github.base_ref }}
          git merge-base --is-ancestor origin/${{ github.base_ref }} HEAD || {
            echo "Branch is behind base branch. Please rebase."
            exit 1
          }
      
      - name: Check file sizes
        run: |
          find . -type f -size +10M | grep -v node_modules | grep -v .git | grep -v .venv || true
          large_files=$(find . -type f -size +10M | grep -v node_modules | grep -v .git | grep -v .venv | wc -l)
          if [ $large_files -gt 0 ]; then
            echo "Warning: Found $large_files file(s) larger than 10MB"
          fi
